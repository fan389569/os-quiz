<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>操作系统 · 期末刷题</title>
<style>:root{
  --bg:#f5f2ea; --surface:#fffdf8; --surface-2:#faf7f0; --ink:#23201a; --muted:#6f6a5f;
  --line:#e2dcd0; --line-2:#d3cabb; --accent:#8e3524; --accent-2:#b4573f; --accent-soft:#f4e5df;
  --ok:#2f6b4f; --ok-soft:#e3efe7; --warn:#8a5a12; --warn-soft:#f7ecd8; --bad:#9c3b2c;
  --shadow:0 1px 2px rgba(50,40,25,.05), 0 10px 30px -22px rgba(50,40,25,.5);
}
html[data-theme="dark"]{
  --bg:#14130f; --surface:#1c1a15; --surface-2:#211f19; --ink:#ebe5d8; --muted:#a69c8b;
  --line:#322d24; --line-2:#423b30; --accent:#e08a70; --accent-2:#c9735c; --accent-soft:#38241d;
  --ok:#7fc09a; --ok-soft:#1e3229; --warn:#e0b878; --warn-soft:#33291a; --bad:#ef9a86;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent)}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .inner{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Georgia,"Songti SC","SimSun",serif;font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:inherit;font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:14px;padding:7px 12px;
  border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
.panel{display:none}
.panel.on{display:block}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  font-size:13px;padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
html[data-theme="dark"] .chip.on{color:#1b1712}
.chip .n{opacity:.7;font-size:11px;margin-left:4px}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font-size:13px;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-2);color:#fff}
html[data-theme="dark"] .btn.primary{color:#1b1712}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{font-size:12.5px;padding:4px 12px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qhead h2{margin:0;font-size:18px;font-family:Georgia,"Songti SC",serif}
.badge{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted)}
.badge.chapter{color:var(--accent);background:var(--accent-soft);border-color:transparent}

.prompt{font-size:15px}
.prompt p{margin:8px 0}
.prompt .mono{font-family:Consolas,"Cascadia Mono",monospace}
.seqline{font-family:Consolas,monospace;letter-spacing:.04em;background:var(--surface-2);
  padding:6px 10px;border-radius:8px;display:inline-block}
.ops{margin:6px 0 6px 18px;padding:0}
.ops li{margin:2px 0}
.quick{margin:6px 0 0 18px;padding:0}
.quick>li{margin:14px 0}
.quick>li>p{margin:4px 0 0}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.tbl th{background:var(--surface-2);font-size:12.5px;font-weight:700}
.tbl.bank td:first-child{font-weight:700;text-align:left}
.tbl.pr td{min-width:26px;padding:4px 5px;font-family:Consolas,monospace}
.tbl.pr .fault{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tbl.pr .faultrow td{background:var(--surface-2);font-size:11px;color:var(--accent)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tblwrap .tbl{min-width:100%;width:auto;margin:0}
.prompt pre,.full pre,.ccard pre{overflow-x:auto;max-width:100%;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.6;
  font-family:Consolas,"Cascadia Mono",monospace;margin:8px 0}
.card,.ccard,.eq,.reveal{min-width:0}
.stem,.prompt{overflow-wrap:anywhere}

.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;margin:16px 0 4px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12.5px;color:var(--muted)}
.field input,.field select{font-size:17px;padding:9px 12px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field input[type=number]{font-variant-numeric:tabular-nums}
.field.wide{grid-column:1/-1}
.field.wide input{font-size:16px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.feedback{display:none;margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid var(--line)}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.feedback.bad{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.feedback .head{font-size:16px;font-weight:700;margin-bottom:4px}
.feedback.ok .head{color:var(--ok)}
.feedback.bad .head{color:var(--accent)}
.parts{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px}
.parts li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.parts .yes{color:var(--ok)}
.parts .no{color:var(--accent)}
.parts .want{color:var(--muted);font-size:12.5px}

.solution{margin-top:16px;border-top:1px dashed var(--line-2);padding-top:12px}
.solution h3{margin:0 0 6px;font-size:15px}
.solution h4{margin:14px 0 6px;font-size:14px;color:var(--accent)}
.solution p{margin:6px 0}
.solution .mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:13.5px;background:var(--surface-2);
  padding:6px 10px;border-radius:8px}
.solution .hint{color:var(--muted);font-size:12.5px}
.solution .warn{color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px;font-size:13px}
.solution .gantt{display:flex;margin:10px 0 2px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.solution .gseg{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;background:var(--surface-2);border-right:1px solid var(--line);font-size:12px;min-width:0}
.solution .gseg:last-child{border-right:0}
.solution .gseg:nth-child(even){background:var(--accent-soft)}
.solution .gseg b{font-size:13px}
.solution .gseg span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.solution .gline{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding:0 2px}

/* 概念题 */
.clist{display:flex;flex-direction:column;gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.ccard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.ccard .stem{font-size:15px}
.ccard .stem p{margin:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;font-size:14.5px;
  background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.opt:hover{background:var(--surface-2);border-color:var(--line)}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.opt.correct{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.opt.wrong .k{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .opt.correct .k,html[data-theme="dark"] .opt.wrong .k{color:#14130f}
.opt.dim{opacity:.5}
.opt.chosen{font-weight:700}
.judgebar{display:flex;gap:10px;margin-top:10px}
.judgebar .opt{width:auto;min-width:130px;justify-content:center}
.fillrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 220px;font-size:17px;padding:9px 12px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--surface-2);color:var(--ink)}
.fillrow input:focus{outline:2px solid var(--accent);border-color:transparent}

.reveal{margin-top:12px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.reveal.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.reveal.bad{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.reveal .verdict{font-weight:700;font-size:14.5px}
.reveal.ok .verdict{color:var(--ok)}
.reveal.bad .verdict{color:var(--accent)}
.reveal .ans{margin:4px 0;font-size:14px}
.reveal .ans b{color:var(--accent)}
.reveal .why{font-size:13px;color:var(--muted);margin:4px 0 0}
.reveal .why b{color:var(--ink)}
.reveal .full{margin-top:8px;font-size:13.5px;border-top:1px dashed var(--line-2);padding-top:8px}
.reveal .full p{margin:4px 0}
.reveal .full table{margin:6px 0}
.selfrow{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.selfrow button{font-size:12.5px;padding:4px 12px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);cursor:pointer}
.selfrow button:hover{border-color:var(--accent);color:var(--accent)}

/* 模拟卷 */
.exambar{position:sticky;top:var(--topH,56px);z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.exambar .timer{margin-left:auto}
.timer{font-family:Consolas,monospace;font-size:20px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums}
.timer.low{color:#c0392b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.examsec h2{font-size:17px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.examsec>.desc{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.eq{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.eq .num{font-size:12px;color:var(--muted);margin-right:6px}
.eq .stem{font-size:14.5px}
.score-big{font-size:44px;font-family:Georgia,serif;color:var(--accent);line-height:1.1}
.score-sub{color:var(--muted);font-size:13px}

/* 统计 */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-family:Georgia,serif;color:var(--accent)}
.stats-table td:first-child{text-align:left;font-weight:700}
.stats-table td:last-child{text-align:left;white-space:normal;color:var(--muted);font-size:12.5px}
.rate{display:flex;align-items:center;gap:9px;justify-content:center}
.rate .bar{flex:1 1 80px;max-width:110px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar i.low{background:var(--accent)}

.export-area{width:100%;min-height:120px;font-family:Consolas,monospace;font-size:12px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:10px}
.selftest{font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.selftest .ok{color:var(--ok)}
.selftest .no{color:var(--accent)}

.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:720px){
  .top .inner{padding:8px 12px 0;gap:8px}
  .brand{font-size:16px}
  .brand small{display:none}
  .tabs{margin-left:0;width:100%;order:3;padding-bottom:0;display:grid;
    grid-template-columns:repeat(5,1fr);gap:2px}
  .tabs button{font-size:11.5px;padding:7px 2px;text-align:center;letter-spacing:-.02em}
  .icon-btn{margin-left:auto}
  .wrap{padding:14px 12px 70px}
  .card{padding:15px 14px;border-radius:14px}
  .qhead h2{font-size:16.5px}
  .opts{grid-template-columns:1fr}
  .answers{grid-template-columns:1fr}
  .field input,.field select{font-size:17px}   /* 防止 iOS 聚焦缩放 */
  .tbl{font-size:11.5px}
  .tbl th,.tbl td{padding:4px 4px}
  .exambar{top:var(--topH,96px)}
  .timer{font-size:18px}
  .judgebar .opt{min-width:0;flex:1}
}
@media print{
  .top,.toolbar,.actions,.exambar{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">操作系统 · 期末刷题<small>计算题每次随机 · 答案由代码算出</small></div>
    <nav class="tabs">
      <button data-act="tab" data-tab="calc" class="on">① 专项计算</button>
      <button data-act="tab" data-tab="concept">② 概念题</button>
      <button data-act="tab" data-tab="exam">③ 模拟整卷</button>
      <button data-act="tab" data-tab="wrong">④ 错题本</button>
      <button data-act="tab" data-tab="stats">⑤ 统计</button>
    </nav>
    <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="panel on" id="tab-calc">
    <div class="toolbar"><div class="chips" id="topicChips"></div></div>
    <div class="toolbar">
      <div class="seg" id="diffSeg">
        <button data-act="diff" data-diff="easy">简单</button>
        <button data-act="diff" data-diff="std" class="on">标准</button>
      </div>
      <span class="badge">每次随机出新题 · 答案由代码计算</span>
    </div>
    <div id="calcBox"></div>
  </section>

  <section class="panel" id="tab-concept">
    <div class="chips" id="conceptChips" style="margin-bottom:14px"></div>
    <div id="conceptList"></div>
  </section>

  <section class="panel" id="tab-exam"><div id="examBox"></div></section>

  <section class="panel" id="tab-wrong"><div id="wrongBox"></div></section>

  <section class="panel" id="tab-stats"><div id="statsBox"></div></section>
</main>

<div class="toast" id="toast"></div>

<script>/* ==========================================================================
   OSQ 计算引擎：纯函数，可在浏览器和 Node 里运行
   所有题目的答案都由这里的计算得出，解析表格也用同一份结果渲染
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.OSQ = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------ 随机数 ------------------------------ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function shuffle(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function round(x, d) { var k = Math.pow(10, d); return Math.round(x * k) / k; }
  function vecStr(v) { return v.join(String.fromCharCode(160)); }
  function uniqNums(rng, n, lo, hi) {
    var out = [], used = {};
    while (out.length < n) {
      var x = ri(rng, lo, hi);
      if (!used[x]) { used[x] = 1; out.push(x); }
    }
    return out;
  }

  /* ==========================================================================
     1. 银行家算法
     ========================================================================== */
  function safetyCheck(alloc, need, avail) {
    var n = alloc.length, m = avail.length;
    var work = avail.slice(), done = [], seq = [], table = [], left = n;
    for (var i = 0; i < n; i++) done.push(false);
    while (left > 0) {
      var found = -1;
      for (var p = 0; p < n; p++) {
        if (done[p]) continue;
        var ok = true;
        for (var r = 0; r < m; r++) {
          if (need[p][r] > work[r]) { ok = false; break; }
        }
        if (ok) { found = p; break; }
      }
      if (found < 0) break;
      var row = { p: found, work: work.slice(), need: need[found].slice(), alloc: alloc[found].slice() };
      for (var r2 = 0; r2 < m; r2++) work[r2] += alloc[found][r2];
      row.after = work.slice();
      table.push(row);
      done[found] = true; seq.push(found); left--;
    }
    return { safe: left === 0, seq: seq, table: table };
  }

  function tryGrant(alloc, need, avail, p, req) {
    var m = avail.length, r;
    for (r = 0; r < m; r++) {
      if (req[r] > need[p][r]) return { ok: false, why: 'req>need', step: 'req-need' };
    }
    for (r = 0; r < m; r++) {
      if (req[r] > avail[r]) return { ok: false, why: 'req>avail', step: 'req-avail' };
    }
    var a2 = alloc.map(function (row) { return row.slice(); });
    var n2 = need.map(function (row) { return row.slice(); });
    var v2 = avail.slice();
    for (r = 0; r < m; r++) {
      a2[p][r] += req[r];
      n2[p][r] -= req[r];
      v2[r] -= req[r];
    }
    var chk = safetyCheck(a2, n2, v2);
    return { ok: chk.safe, why: chk.safe ? 'safe' : 'unsafe', avail2: v2, alloc2: a2,
             need2: n2, chk: chk, step: 'trial' };
  }

  function parseProcSeq(text, n) {
    if (!text) return null;
    var nums = String(text).match(/\d+/g);
    if (!nums) return null;
    nums = nums.map(Number);
    if (nums.length !== n) return null;
    var seen = {};
    for (var i = 0; i < n; i++) {
      var v = nums[i];
      if (v < 0 || v >= n || seen[v]) return null;
      seen[v] = 1;
    }
    return nums;
  }

  function validSequence(alloc, need, avail, seq) {
    var work = avail.slice(), m = avail.length, n = alloc.length;
    if (seq.length !== n) return { ok: false, at: -1 };
    for (var i = 0; i < n; i++) {
      var p = seq[i];
      for (var r = 0; r < m; r++) {
        if (need[p][r] > work[r]) return { ok: false, at: i, p: p };
      }
      for (var r2 = 0; r2 < m; r2++) work[r2] += alloc[p][r2];
    }
    return { ok: true };
  }

  function resNames(m) { return ['A', 'B', 'C', 'D'].slice(0, m); }

  // TLB 有效访问时间（命中：查 TLB + 访存；未命中：查 TLB + 查页表 + 访存）
  function eatCalc(hitPct, tlbNs, memNs) {
    return (hitPct / 100) * (tlbNs + memNs) + (1 - hitPct / 100) * (tlbNs + 2 * memNs);
  }

  function genBanker(rng, diff) {
    var m = diff === 'easy' ? 3 : 4, n = 5;
    var wantUnsafe = rng() < 0.4;
    var wantGrant = !wantUnsafe && rng() < 0.7;   // 不安全状态下任何请求都不可能安全地满足
    var alloc, need, avail, chk, rp = -1, req = null, grant = null, found = false;

    for (var sysTry = 0; sysTry < 300 && !found; sysTry++) {
      avail = [];
      for (var r = 0; r < m; r++) avail.push(ri(rng, 1, diff === 'easy' ? 2 : 3));
      alloc = []; need = [];
      for (var p = 0; p < n; p++) {
        var a = [], nd = [];
        for (var r2 = 0; r2 < m; r2++) a.push(ri(rng, 0, diff === 'easy' ? 2 : 3));
        for (var r3 = 0; r3 < m; r3++) nd.push(ri(rng, 0, diff === 'easy' ? 3 : 4));
        if (nd.every(function (x) { return x === 0; })) nd[ri(rng, 0, m - 1)] = ri(rng, 1, 3);
        alloc.push(a); need.push(nd);
      }
      chk = safetyCheck(alloc, need, avail);
      if (chk.safe === wantUnsafe) continue;   // 安全性与本次要求不符

      // 在这个系统里找一个满足目标结论的请求
      for (var k = 0; k < 240 && !found; k++) {
        var pp = ri(rng, 0, n - 1);
        if (!need[pp].some(function (v) { return v > 0; })) continue;
        var rq = need[pp].map(function (v) { return ri(rng, 0, v); });
        if (rq.every(function (v) { return v === 0; })) {
          var nz = [];
          for (var q = 0; q < m; q++) if (need[pp][q] > 0) nz.push(q);
          rq[nz[ri(rng, 0, nz.length - 1)]] = 1;
        }
        if (wantGrant) {
          for (var r4 = 0; r4 < m; r4++) rq[r4] = Math.min(rq[r4], avail[r4]);
        } else if (rng() < 0.5) {
          var over = false, cands = [];
          for (var r5 = 0; r5 < m; r5++) {
            if (rq[r5] > avail[r5]) over = true;
            if (avail[r5] < need[pp][r5]) cands.push(r5);
          }
          if (!over && cands.length) {
            var rc = cands[ri(rng, 0, cands.length - 1)];
            rq[rc] = avail[rc] + ri(rng, 1, need[pp][rc] - avail[rc]);
          }
        }
        if (rq.every(function (v) { return v === 0; })) continue;
        var g = tryGrant(alloc, need, avail, pp, rq);
        if (g.ok === wantGrant) { rp = pp; req = rq; grant = g; found = true; }
      }
    }
    if (!req) {
      rp = 0;
      req = need[0].map(function (v, i) { return i === 0 ? 1 : 0; });
      if (req[0] > need[0][0]) req = need[0].slice();
      grant = tryGrant(alloc, need, avail, rp, req);
    }

    var rn = resNames(m);
    var cn = ['', '一', '二', '三', '四'][m] || m;
    var head = '<p>现有 5 个进程 P0～P4 共享 ' + rn.join('、') + ' ' + cn + '类资源，' +
      '当前的 Allocation（已分配）、Need（尚需）与 Available（可用）如下表：</p>';
    var tbl = '<p class="hint" style="font-size:12.5px;color:var(--muted);margin:2px 0 0">资源顺序：' +
      rn.join('、') + '（' + cn + '类资源）</p>' +
      '<table class="tbl bank"><thead><tr><th>进程</th><th>Allocation</th>' +
      '<th>Need</th><th>Available</th></tr></thead><tbody>';
    for (var i2 = 0; i2 < n; i2++) {
      tbl += '<tr><td>P' + i2 + '</td><td>' + vecStr(alloc[i2]) + '</td><td>' + vecStr(need[i2]) + '</td>' +
        '<td>' + (i2 === 0 ? vecStr(avail) : '') + '</td></tr>';
    }
    tbl += '</tbody></table>';
    var total = avail.map(function (v, r6) {
      return v + alloc.reduce(function (a, row) { return a + row[r6]; }, 0);
    });
    tbl += '<p class="hint" style="font-size:12.5px;color:var(--muted)">系统资源总数 = Allocation 合计 + Available = (' +
      total.join(' ') + ')</p>';
    var prompt = head + tbl +
      '<p>（1）系统当前是否处于安全状态？若安全，请给出一个安全序列。</p>' +
      '<p>（2）此时进程 P' + rp + ' 提出请求 Request(' + vecStr(req) + ')，系统能否把资源分配给它？为什么？</p>';

    var answer = '';
    answer += '<h4>（1）安全性检查</h4>';
    if (chk.safe) {
      answer += '<p>按 Work ← Work + Allocation 的顺序推进，可得到一个安全序列：<b>P' +
        chk.seq.join('、P') + '</b>。</p>';
    } else {
      answer += '<p>反复寻找 Need ≤ Work 的进程，最后仍有进程无法完成，<b>不存在安全序列</b>，系统处于不安全状态。</p>';
    }
    answer += '<table class="tbl bank"><thead><tr><th>进程</th><th>Work</th><th>Need</th><th>Allocation</th>' +
      '<th>Work+Allocation</th><th>Finish</th></tr></thead><tbody>';
    chk.table.forEach(function (row) {
      answer += '<tr><td>P' + row.p + '</td><td>' + vecStr(row.work) + '</td><td>' + vecStr(row.need) +
        '</td><td>' + vecStr(row.alloc) + '</td><td>' + vecStr(row.after) + '</td><td>TRUE</td></tr>';
    });
    if (!chk.safe) {
      var done = {};
      chk.seq.forEach(function (x) { done[x] = 1; });
      var finalWork = chk.table.length ? chk.table[chk.table.length - 1].after : avail.slice();
      for (var z = 0; z < n; z++) {
        if (!done[z]) answer += '<tr><td>P' + z + '</td><td>' + vecStr(finalWork) + '</td><td>' + vecStr(need[z]) +
          '</td><td>' + vecStr(alloc[z]) + '</td><td>—</td><td>FALSE</td></tr>';
      }
    }
    answer += '</tbody></table>';

    answer += '<h4>（2）处理 P' + rp + ' 的请求</h4>';
    answer += '<p class="mono">Request(' + vecStr(req) + ') ≤ Need(' + vecStr(need[rp]) + ')：' +
      (req.every(function (v, i3) { return v <= need[rp][i3]; }) ? '成立' : '不成立') + '</p>';
    answer += '<p class="mono">Request(' + vecStr(req) + ') ≤ Available(' + vecStr(avail) + ')：' +
      (req.every(function (v, i4) { return v <= avail[i4]; }) ? '成立' : '不成立') + '</p>';
    if (grant.step === 'req-need' || grant.step === 'req-avail') {
      answer += '<p>请求不满足上述任一前提，<b>不能分配</b>（进程应继续等待）。</p>';
    } else {
      answer += '<p>试分配：Available 减为 (' + vecStr(grant.avail2) + ')，P' + rp + ' 的 Need 变为 (' +
        vecStr(grant.need2[rp]) + ')。在新状态上再做安全性检查：' +
        (grant.chk.safe ? '存在安全序列 P' + grant.chk.seq.join('、P') + '，<b>可以分配</b>。'
                        : '找不到安全序列，系统会进入不安全状态，<b>不能分配</b>。') + '</p>';
      if (!grant.chk.safe) {
        answer += '<table class="tbl bank"><thead><tr><th>进程</th><th>Work</th><th>Need</th><th>Allocation</th>' +
          '<th>Work+Allocation</th><th>Finish</th></tr></thead><tbody>';
        grant.chk.table.forEach(function (row) {
          answer += '<tr><td>P' + row.p + '</td><td>' + vecStr(row.work) + '</td><td>' + vecStr(row.need) +
            '</td><td>' + vecStr(row.alloc) + '</td><td>' + vecStr(row.after) + '</td><td>TRUE</td></tr>';
        });
        answer += '</tbody></table>';
      }
    }

    return {
      topic: 'banker', title: '银行家算法',
      promptHTML: prompt, answerHTML: answer,
      truth: { safe: chk.safe ? 'safe' : 'unsafe', seq: chk.safe ? 'P' + chk.seq.join(',P') : '',
               grant: grant.ok ? 'yes' : 'no' },
      inputSpec: [
        { key: 'safe', type: 'select', label: '（1）是否安全', options: [['safe', '安全'], ['unsafe', '不安全']] },
        { key: 'seq', type: 'text', label: '安全序列（不安全可留空）', placeholder: '如 P0,P2,P3,P4,P1' },
        { key: 'grant', type: 'select', label: '（2）能否分配', options: [['yes', '能分配'], ['no', '不能分配']] }
      ],
      check: function (v) {
        var parts = [];
        var safeOk = v.safe === (chk.safe ? 'safe' : 'unsafe');
        parts.push({ name: '（1）安全性判断', ok: safeOk, want: chk.safe ? '安全' : '不安全' });
        if (chk.safe) {
          var seq = parseProcSeq(v.seq, n);
          var r = seq ? validSequence(alloc, need, avail, seq) : { ok: false, at: -1 };
          parts.push({
            name: '（1）安全序列', ok: !!r.ok,
            want: r.ok ? '有效' : (seq ? '第 ' + (r.at + 1) + ' 步不满足 Need ≤ Work' : '需要给出 ' + n + ' 个进程的一个排列')
          });
        }
        var grantOk = v.grant === (grant.ok ? 'yes' : 'no');
        parts.push({ name: '（2）能否分配', ok: grantOk, want: grant.ok ? '能分配' : '不能分配' });
        return { ok: parts.every(function (p) { return p.ok; }), parts: parts };
      }
    };
  }

  /* ==========================================================================
     2. 页面置换
     ========================================================================== */
  function simulatePR(seq, nf, algo) {
    var slots = [], queue = [], recency = [], steps = [], faults = 0;
    for (var i = 0; i < nf; i++) slots.push(null);
    for (var t = 0; t < seq.length; t++) {
      var page = seq[t], hit = slots.indexOf(page) !== -1, victim = null;
      if (hit) {
        if (algo === 'LRU') {
          var k = recency.indexOf(page);
          if (k >= 0) recency.splice(k, 1);
          recency.push(page);
        }
      } else {
        faults++;
        var slot = slots.indexOf(null);
        if (slot < 0) {
          if (algo === 'FIFO') {
            var vp = queue.shift();
            slot = slots.indexOf(vp);
            victim = vp;
          } else if (algo === 'LRU') {
            var lp = recency.shift();
            slot = slots.indexOf(lp);
            victim = lp;
          } else { // OPT
            var far = -1, farIdx = -1;
            for (var s = 0; s < nf; s++) {
              var pg = slots[s], nxt = Infinity;
              for (var j = t + 1; j < seq.length; j++) {
                if (seq[j] === pg) { nxt = j; break; }
              }
              if (nxt > far) { far = nxt; farIdx = s; }
              if (nxt === Infinity) { farIdx = s; break; }
            }
            slot = farIdx;
            victim = slots[slot];
          }
          slots[slot] = page;
          if (algo === 'FIFO') queue.push(page);
          if (algo === 'LRU') recency.push(page);
        } else {
          slots[slot] = page;
          if (algo === 'FIFO') queue.push(page);
          if (algo === 'LRU') recency.push(page);
        }
      }
      steps.push({ page: page, slots: slots.slice(), fault: !hit, victim: victim });
    }
    return { faults: faults, steps: steps, rate: faults + '/' + seq.length };
  }

  function prTable(seq, res) {
    var nf = res.steps[0] ? res.steps[0].slots.length : 3;
    var h = '<table class="tbl pr"><thead><tr><th>页框＼访问</th>';
    seq.forEach(function (p) { h += '<th>' + p + '</th>'; });
    h += '</tr></thead><tbody>';
    for (var s = 0; s < nf; s++) {
      h += '<tr><td>页框' + s + '</td>';
      res.steps.forEach(function (st) {
        h += '<td class="' + (st.fault ? 'fault' : '') + '">' + (st.slots[s] === null ? '·' : st.slots[s]) + '</td>';
      });
      h += '</tr>';
    }
    h += '<tr class="faultrow"><td>缺页</td>';
    res.steps.forEach(function (st) { h += '<td>' + (st.fault ? '√' : '') + '</td>'; });
    h += '</tr></tbody></table>';
    return h;
  }

  function genPaging(rng, diff) {
    var nf = diff === 'easy' ? 3 : (rng() < 0.5 ? 3 : 4);
    var len = ri(rng, 12, 16);
    var pool = shuffle(rng, [0, 1, 2, 3, 4, 5, 6, 7]).slice(0, ri(rng, 4, 6));
    var seq = [];
    for (var i = 0; i < len; i++) seq.push(pick(rng, pool));
    // 避免整个序列过于单调（少于 3 种页号作废）
    if (new Set(seq).size < 3) seq[0] = (seq[0] + 1) % 8;

    var algos = shuffle(rng, ['FIFO', 'LRU', 'OPT']).slice(0, 2);
    var res = {};
    algos.forEach(function (a) { res[a] = simulatePR(seq, nf, a); });

    var prompt = '<p>某进程的页面访问序列为：</p><p class="seqline">' + seq.join('，') + '</p>' +
      '<p>若系统分配给该进程 <b>' + nf + '</b> 个物理块（初始为空），分别按以下两种算法计算缺页次数：</p>' +
      '<p>（1）<b>' + algos[0] + '</b>　（2）<b>' + algos[1] + '</b></p>';

    var answer = '';
    algos.forEach(function (a, idx) {
      var r = res[a];
      answer += '<h4>（' + (idx + 1) + '）' + a + '：缺页 ' + r.faults + ' 次，缺页率 ' + r.faults + '/' + seq.length +
        ' ≈ ' + (r.faults / seq.length * 100).toFixed(1) + '%</h4>';
      answer += prTable(seq, r);
      answer += '<p class="hint">表中标底色的是缺页；命中不改变页框内容。' +
        (a === 'FIFO' ? 'FIFO 按调入先后淘汰最早的页，命中不改变队列顺序。' :
         a === 'LRU' ? 'LRU 淘汰最久未被访问的页，命中时要把该页移到最新端。' :
         'OPT 淘汰以后最长时间不再访问（或不再访问）的页。') + '</p>';
    });

    return {
      topic: 'paging', title: '页面置换 · ' + algos.join(' / '),
      promptHTML: prompt, answerHTML: answer,
      truth: (function () { var t = {}; t.a = res[algos[0]].faults; t.b = res[algos[1]].faults; return t; })(),
      inputSpec: [
        { key: 'a', type: 'number', label: '（1）' + algos[0] + ' 缺页次数' },
        { key: 'b', type: 'number', label: '（2）' + algos[1] + ' 缺页次数' }
      ],
      check: function (v) {
        var x = Number(v.a), y = Number(v.b);
        var p1 = { name: algos[0] + ' 缺页次数', ok: x === res[algos[0]].faults, want: res[algos[0]].faults + ' 次' };
        var p2 = { name: algos[1] + ' 缺页次数', ok: y === res[algos[1]].faults, want: res[algos[1]].faults + ' 次' };
        return { ok: p1.ok && p2.ok, parts: [p1, p2] };
      }
    };
  }

  /* ==========================================================================
     3. 磁盘调度
     口径：SCAN 在「该方向上最远的请求」处掉头；C-SCAN 扫到该方向最远请求后，
     直接跳到另一侧最远的请求，回程距离计入总寻道距离。
     ========================================================================== */
  function diskOrder(reqs, start, dir, algo) {
    var list = reqs.slice().sort(function (a, b) { return a - b; });
    var up = list.filter(function (x) { return x > start; });
    var down = list.filter(function (x) { return x < start; }).reverse(); // 由近到远
    var order = [], tie = false;
    if (algo === 'SSTF') {
      var rest = list.slice(), pos = start;
      while (rest.length) {
        var bd = Infinity, best = -1, cnt = 0;
        for (var i = 0; i < rest.length; i++) {
          var d = Math.abs(rest[i] - pos);
          if (d < bd) { bd = d; best = i; cnt = 1; }
          else if (d === bd) cnt++;
        }
        if (cnt > 1) tie = true;
        order.push(rest[best]); pos = rest[best]; rest.splice(best, 1);
      }
    } else if (algo === 'SCAN') {
      if (dir > 0) order = up.concat(down);
      else order = down.concat(up);
    } else { // C-SCAN
      if (dir > 0) {
        if (up.length) order = up.concat(down.slice().sort(function (a, b) { return a - b; }));
        else order = down.slice().sort(function (a, b) { return a - b; });
      } else {
        if (down.length) order = down.concat(up.slice().sort(function (a, b) { return b - a; }));
        else order = up.slice().sort(function (a, b) { return b - a; });
      }
    }
    var pos2 = start, dists = [], total = 0;
    order.forEach(function (x) {
      var d = Math.abs(x - pos2);
      dists.push(d); total += d; pos2 = x;
    });
    return { order: order, dists: dists, total: total, tie: tie };
  }

  function genDisk(rng, diff) {
    var reqs, start, dir, res, sstf, tries = 0;
    do {
      reqs = uniqNums(rng, 8, 0, 399);
      start = ri(rng, 0, 399);
      while (reqs.indexOf(start) !== -1) start = ri(rng, 0, 399);
      dir = rng() < 0.5 ? 1 : -1;
      sstf = diskOrder(reqs, start, dir, 'SSTF');
      tries++;
    } while (sstf.tie && tries < 300);

    var algos = shuffle(rng, ['SCAN', 'C-SCAN', 'SSTF']).slice(0, 2);
    // 固定顺序便于阅读：SSTF 放前面
    algos.sort(function (a, b) {
      if (a === 'SSTF') return -1;
      if (b === 'SSTF') return 1;
      return 0;
    });
    res = {};
    algos.forEach(function (a) { res[a] = a === 'SSTF' ? sstf : diskOrder(reqs, start, dir, a); });

    var prompt = '<p>磁盘请求队列中的柱面号为：<b>' + reqs.join('、') + '</b>，磁头当前位于 <b>' + start +
      '</b> 号柱面，运行方向为<b>' + (dir > 0 ? '向大号柱面' : '向小号柱面') + '</b>。</p>' +
      '<p>分别计算下列算法完成全部请求的总寻道距离：</p><p>（1）<b>' + algos[0] + '</b>　（2）<b>' +
      algos[1] + '</b></p>';

    var answer = '';
    algos.forEach(function (a, idx) {
      var r = res[a];
      answer += '<h4>（' + (idx + 1) + '）' + a + '：总寻道距离 ' + r.total + '</h4>';
      answer += '<p class="mono">' + start + ' → ' + r.order.join(' → ') + '</p>';
      answer += '<p class="mono">' + r.dists.join(' + ') + ' = ' + r.total + '</p>';
      var note = a === 'SCAN' ? '电梯算法沿当前方向走到该方向上最远的请求后掉头，反向继续服务。'
        : a === 'C-SCAN' ? '循环扫描沿当前方向扫到最远请求后，直接跳到另一侧最远的请求，回程（跳转）距离也要计入。'
        : '最短寻道优先每次挑离当前磁头最近的请求，与方向无关。';
      answer += '<p class="hint">' + note + '</p>';
    });

    return {
      topic: 'disk', title: '磁盘调度 · ' + algos.join(' / '),
      promptHTML: prompt, answerHTML: answer,
      truth: (function () { var t = {}; t.a = res[algos[0]].total; t.b = res[algos[1]].total; return t; })(),
      inputSpec: [
        { key: 'a', type: 'number', label: '（1）' + algos[0] + ' 总寻道距离' },
        { key: 'b', type: 'number', label: '（2）' + algos[1] + ' 总寻道距离' }
      ],
      check: function (v) {
        var p1 = { name: algos[0], ok: Number(v.a) === res[algos[0]].total, want: res[algos[0]].total };
        var p2 = { name: algos[1], ok: Number(v.b) === res[algos[1]].total, want: res[algos[1]].total };
        return { ok: p1.ok && p2.ok, parts: [p1, p2] };
      }
    };
  }

  /* ==========================================================================
     4. inode / 多级索引
     ========================================================================== */
  function inodeCalc(bs, addr, direct, lv) {
    var P = Math.floor(bs / addr);
    var max = direct;
    if (lv[0]) max += P;
    if (lv[1]) max += P * P;
    if (lv[2]) max += P * P * P;
    return { P: P, maxBytes: max * bs, maxBlocks: max };
  }

  function inodeReads(blockNo, P, direct, lv) {
    if (blockNo < direct) return 1;
    var b = blockNo - direct;
    if (lv[0]) {
      if (b < P) return 2;
      b -= P;
    }
    if (lv[1]) {
      if (b < P * P) return 3;
      b -= P * P;
    }
    if (lv[2]) {
      if (b < P * P * P) return 4;
    }
    return -1;
  }

  function inodeBlocks(size, bs, P, direct, lv) {
    var data = Math.ceil(size / bs);
    var idx = 0, rem = data;
    rem -= Math.min(rem, direct);
    if (lv[0] && rem > 0) { var u1 = Math.min(rem, P); idx += 1; rem -= u1; }
    if (lv[1] && rem > 0) {
      var u2 = Math.min(rem, P * P);
      idx += 1 + Math.ceil(u2 / P);
      rem -= u2;
    }
    if (lv[2] && rem > 0) {
      var u3 = Math.min(rem, P * P * P);
      idx += 1 + Math.ceil(u3 / (P * P)) + Math.ceil(u3 / P);
      rem -= u3;
    }
    return { data: data, index: idx, total: data + idx, rest: rem };
  }

  function genInode(rng, diff) {
    var bs = diff === 'easy' ? 512 : pick(rng, [512, 1024]);
    var addr = pick(rng, [4, 8]);
    var direct = ri(rng, 5, diff === 'easy' ? 8 : 12);
    var lv;
    do {
      lv = [rng() < 0.75, rng() < 0.5, rng() < 0.3];
    } while (!lv[0] && !lv[1] && !lv[2]); // 至少有一级间接

    var info = inodeCalc(bs, addr, direct, lv);
    var P = info.P;

    // 第 2 问：选一个位于「较深层」的偏移
    var regions = [];
    if (lv[0]) regions.push({ name: '一级间接', start: direct, cap: P });
    if (lv[1]) regions.push({ name: '二级间接', start: direct + (lv[0] ? P : 0), cap: P * P });
    if (lv[2]) regions.push({ name: '三级间接', start: direct + (lv[0] ? P : 0) + (lv[1] ? P * P : 0), cap: P * P * P });
    var reg = pick(rng, regions);
    var offBlock = reg.start + ri(rng, 1, Math.min(reg.cap, 400)) - 1;
    var offset = offBlock * bs + ri(rng, 0, bs - 1);
    var reads = inodeReads(offBlock, P, direct, lv);

    // 第 3 问：文件大小，保证落在「有索引块」的区域
    var minBlock = direct + 1;
    var sizeBlocks = minBlock + ri(rng, 1, Math.min(600, info.maxBlocks - minBlock - 1));
    var fileSize = sizeBlocks * bs - ri(rng, 0, Math.min(bs - 1, 200));
    var blk = inodeBlocks(fileSize, bs, P, direct, lv);

    var lvTxt = ['一级间接', '二级间接', '三级间接'];
    var lvDesc = lv.map(function (b, i) { return b ? lvTxt[i] + ' 1 个' : lvTxt[i] + ' 无'; }).join('，');
    var prompt = '<p>某文件系统采用 i 结点（索引结点）方式管理文件。每个 i 结点中有 <b>' + direct +
      '</b> 个直接地址项，' + lvDesc + '。每个磁盘块大小为 <b>' + bs + 'B</b>，每个盘块号占 <b>' + addr +
      'B</b>。</p><p>（1）该文件系统允许的最大文件是多少字节？</p>' +
      '<p>（2）某文件的 i 结点已在内存，其余信息都在外存。要访问该文件中偏移量为 <b>' + offset +
      '</b> 字节的内容，需要访问几次磁盘？</p>' +
      '<p>（3）若某文件实际大小为 <b>' + fileSize + ' 字节</b>，它实际占用多少个磁盘块（含索引块）？</p>';

    var answer = '<p>每个索引块能存放的盘块号个数：' + bs + ' ÷ ' + addr + ' = <b>' + P + '</b> 个。</p>';
    answer += '<h4>（1）最大文件</h4><p class="mono">(' + direct +
      (lv[0] ? ' + ' + P : '') + (lv[1] ? ' + ' + P + '²' : '') + (lv[2] ? ' + ' + P + '³' : '') +
      ') × ' + bs + 'B = ' + info.maxBlocks + ' × ' + bs + 'B = <b>' + info.maxBytes + ' B</b>' +
      '（约 ' + (info.maxBytes / 1048576).toFixed(1) + ' MB）</p>';
    answer += '<h4>（2）偏移 ' + offset + ' 的访问次数</h4>' +
      '<p class="mono">' + offset + ' ÷ ' + bs + ' = ' + Math.floor(offset / bs) + ' 余 ' + (offset % bs) +
      '，即逻辑块号 ' + Math.floor(offset / bs) + '</p>' +
      '<p>前 ' + direct + ' 块为直接地址' + (lv[0] ? '，接着 ' + P + ' 块为一级间接' : '') +
      (lv[1] ? '，再 ' + (P * P) + ' 块为二级间接' : '') + '。该块落在<b>' + reg.name + '</b>区域，' +
      '需要读 ' + (reads - 1) + ' 个索引块 + 1 个数据块，共 <b>' + reads + ' 次</b>访问磁盘（i 结点已在内存）。</p>';
    answer += '<h4>（3）' + fileSize + ' 字节文件的占用</h4>';
    answer += '<p class="mono">数据块 = ⌈' + fileSize + ' ÷ ' + bs + '⌉ = ' + blk.data + ' 块</p>';
    answer += '<p>其中直接地址覆盖 ' + Math.min(blk.data, direct) + ' 块；一级间接覆盖 ' +
      Math.min(Math.max(blk.data - direct, 0), lv[0] ? P : 0) + ' 块；其余走二级/三级间接。</p>';
    answer += '<p class="mono">索引块合计 ' + blk.index + ' 块，总占用 = ' + blk.data + ' + ' + blk.index +
      ' = <b>' + blk.total + ' 块</b></p>';
    if (blk.rest > 0) answer += '<p class="warn">数据块超出该 i 结点可表示的范围，题目数据有误。</p>';

    return {
      topic: 'inode', title: 'inode 索引结构',
      promptHTML: prompt, answerHTML: answer,
      truth: { max: info.maxBytes, reads: reads, blocks: blk.total },
      inputSpec: [
        { key: 'max', type: 'number', label: '（1）最大文件大小（字节）' },
        { key: 'reads', type: 'number', label: '（2）访问磁盘次数' },
        { key: 'blocks', type: 'number', label: '（3）实际占用块数' }
      ],
      check: function (v) {
        var p1 = { name: '最大文件', ok: Number(v.max) === info.maxBytes, want: info.maxBytes + ' B' };
        var p2 = { name: '访问次数', ok: Number(v.reads) === reads, want: reads + ' 次' };
        var p3 = { name: '占用块数', ok: Number(v.blocks) === blk.total, want: blk.total + ' 块' };
        return { ok: p1.ok && p2.ok && p3.ok, parts: [p1, p2, p3] };
      }
    };
  }

  /* ==========================================================================
     5. 分页地址变换
     ========================================================================== */
  function genAddr(rng, diff) {
    function hx(n) { return '0x' + n.toString(16).toUpperCase(); }

    // 第 1 部分：十进制
    var pageSizeA = pick(rng, [1024, 2048, 4096]);
    var pagesA = ri(rng, 8, 14);
    var blocksA = uniqNums(rng, pagesA, 0, 31);
    var pageA = ri(rng, 0, pagesA - 1);
    var offA = ri(rng, 0, pageSizeA - 1);
    var logA = pageA * pageSizeA + offA;
    var blockA = blocksA[pageA];
    var physA = blockA * pageSizeA + offA;

    // 第 2 部分：十六进制
    var pageSizeB = pick(rng, [1024, 2048]);
    var pagesB = ri(rng, 8, 14);
    var blocksB = uniqNums(rng, pagesB, 0, 31);
    var pageB = ri(rng, 1, Math.min(pagesB - 1, 6));
    var offB = ri(rng, 0, pageSizeB - 1);
    var logB = pageB * pageSizeB + offB;
    var blockB = blocksB[pageB];
    var physB = blockB * pageSizeB + offB;

    var prompt = '<p><b>（1）十进制地址</b>：页面大小为 <b>' + pageSizeA + 'B</b>，某进程的页表如下：</p>' +
      '<table class="tbl pt"><thead><tr><th>页号</th>' +
      blocksA.map(function (_, i) { return '<th>' + i + '</th>'; }).join('') +
      '</tr></thead><tbody><tr><td>物理块号</td>' +
      blocksA.map(function (b) { return '<td>' + b + '</td>'; }).join('') + '</tr></tbody></table>' +
      '<p>逻辑地址 <b>' + logA + '</b> 的页号、页内偏移、物理地址各是多少？</p>' +
      '<p><b>（2）十六进制地址</b>：页面大小为 <b>' + pageSizeB + 'B</b>（2<sup>' +
      Math.round(Math.log(pageSizeB) / Math.log(2)) + '</sup>B），页表片段：第 ' + pageB + ' 页 → 第 ' +
      blockB + ' 块。</p>' +
      '<p>逻辑地址 <b>' + hx(logB) + '</b>（十进制 ' + logB + '）的页号、页内偏移、物理地址（十六进制）各是多少？</p>';

    var answer = '<h4>（1）十进制：' + logA + '</h4>' +
      '<p class="mono">页号 = ⌊' + logA + ' ÷ ' + pageSizeA + '⌋ = ' + pageA +
      '；页内偏移 = ' + logA + ' mod ' + pageSizeA + ' = ' + offA + '</p>' +
      '<p class="mono">查页表：第 ' + pageA + ' 页在第 ' + blockA + ' 块</p>' +
      '<p class="mono">物理地址 = ' + blockA + ' × ' + pageSizeA + ' + ' + offA + ' = <b>' + physA + '</b></p>' +
      '<h4>（2）十六进制：' + hx(logB) + '</h4>' +
      '<p class="mono">' + hx(logB) + ' = ' + logB + '（十进制），页大小 ' + pageSizeB + 'B = ' +
      hx(pageSizeB) + '</p>' +
      '<p class="mono">页号 = ' + logB + ' ÷ ' + pageSizeB + ' = ' + pageB + '；页内偏移 = ' + offB +
      ' = ' + hx(offB) + '</p>' +
      '<p class="mono">物理地址 = ' + blockB + ' × ' + pageSizeB + ' + ' + offB + ' = ' + physB +
      ' = <b>' + hx(physB) + '</b></p>';

    return {
      topic: 'addr', title: '分页地址变换（十进制 + 十六进制）',
      promptHTML: prompt, answerHTML: answer,
      truth: { p1page: pageA, p1off: offA, p1phys: physA,
               p2page: pageB, p2off: offB.toString(16).toUpperCase(), p2phys: physB.toString(16).toUpperCase() },
      inputSpec: [
        { key: 'p1page', type: 'number', label: '（1）页号' },
        { key: 'p1off', type: 'number', label: '（1）页内偏移' },
        { key: 'p1phys', type: 'number', label: '（1）物理地址' },
        { key: 'p2page', type: 'number', label: '（2）页号' },
        { key: 'p2off', type: 'text', label: '（2）页内偏移（十六进制，如 4A8）' },
        { key: 'p2phys', type: 'text', label: '（2）物理地址（十六进制，如 74A8）' }
      ],
      check: function (v) {
        var offOk = normHex(v.p2off) === offB;
        var physOk = normHex(v.p2phys) === physB;
        return {
          ok: Number(v.p1page) === pageA && Number(v.p1off) === offA && Number(v.p1phys) === physA &&
              Number(v.p2page) === pageB && offOk && physOk,
          parts: [
            { name: '（1）页号', ok: Number(v.p1page) === pageA, want: pageA },
            { name: '（1）页内偏移', ok: Number(v.p1off) === offA, want: offA },
            { name: '（1）物理地址', ok: Number(v.p1phys) === physA, want: physA },
            { name: '（2）页号', ok: Number(v.p2page) === pageB, want: pageB },
            { name: '（2）页内偏移', ok: offOk, want: hx(offB) },
            { name: '（2）物理地址', ok: physOk, want: hx(physB) }
          ]
        };
      }
    };
  }

  function addrDecode(logical, pageSize) {
    return { page: Math.floor(logical / pageSize), off: logical % pageSize };
  }

  function normHex(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().toLowerCase().replace(/^0x/, '').replace(/h$/, '').replace(/\s/g, '');
    if (!/^[0-9a-f]+$/.test(t)) return NaN;
    return parseInt(t, 16);
  }

  /* ==========================================================================
     6. 进程调度
     ========================================================================== */
  function runSchedule(procs, algo, quantum) {
    var n = procs.length;
    var remain = procs.map(function (p) { return p.burst; });
    var done = procs.map(function () { return false; });
    var gantt = [], t = 0, finished = 0;
    var last = null;

    function push(p, start, end) {
      if (end <= start) return;
      if (gantt.length && gantt[gantt.length - 1].p === p && gantt[gantt.length - 1].end === start) {
        gantt[gantt.length - 1].end = end;
      } else {
        gantt.push({ p: p, start: start, end: end });
      }
    }

    if (algo === 'RR') {
      var sorted = procs.map(function (p, i) { return i; }).sort(function (a, b) {
        return procs[a].arr - procs[b].arr || a - b;
      });
      var qi = 0, queue = [], started = [];
      // 初始到达的进程入队
      while (qi < n && procs[sorted[qi]].arr <= t) { queue.push(sorted[qi]); qi++; }
      while (finished < n) {
        if (!queue.length) {
          if (qi < n) { t = procs[sorted[qi]].arr; while (qi < n && procs[sorted[qi]].arr <= t) { queue.push(sorted[qi]); qi++; } }
          else break;
          continue;
        }
        var p = queue.shift();
        var run = Math.min(quantum, remain[p]);
        var start = t;
        t += run; remain[p] -= run;
        push(p, start, t);
        while (qi < n && procs[sorted[qi]].arr <= t) { queue.push(sorted[qi]); qi++; }
        if (remain[p] === 0) { done[p] = true; finished++; }
        else queue.push(p);
      }
    } else {
      while (finished < n) {
        var cand = [];
        for (var i = 0; i < n; i++) if (!done[i] && procs[i].arr <= t) cand.push(i);
        if (!cand.length) {
          var nextArr = Infinity;
          for (var j = 0; j < n; j++) if (!done[j] && procs[j].arr < nextArr) nextArr = procs[j].arr;
          t = nextArr; continue;
        }
        var sel;
        if (algo === 'FCFS') {
          sel = cand.sort(function (a, b) { return procs[a].arr - procs[b].arr || a - b; })[0];
        } else if (algo === 'SJF') {
          sel = cand.sort(function (a, b) { return remain[a] - remain[b] || procs[a].arr - procs[b].arr; })[0];
        } else if (algo === 'SRTF') {
          sel = cand.sort(function (a, b) { return remain[a] - remain[b] || procs[a].arr - procs[b].arr; })[0];
        } else { // HRRN
          sel = cand.sort(function (a, b) {
            var ra = (t - procs[a].arr + procs[a].burst) / procs[a].burst;
            var rb = (t - procs[b].arr + procs[b].burst) / procs[b].burst;
            return rb - ra || procs[a].arr - procs[b].arr;
          })[0];
        }
        var runTo;
        if (algo === 'SRTF') {
          // 跑到「下一个到达时刻」或进程结束
          var nextArr2 = Infinity;
          for (var k = 0; k < n; k++) {
            if (!done[k] && procs[k].arr > t && procs[k].arr < nextArr2) nextArr2 = procs[k].arr;
          }
          runTo = Math.min(t + remain[sel], nextArr2);
        } else {
          runTo = t + remain[sel];
        }
        push(sel, t, runTo);
        remain[sel] -= (runTo - t);
        t = runTo;
        if (remain[sel] === 0) { done[sel] = true; finished++; }
      }
    }

    var res = procs.map(function (p, i) {
      var comp = 0;
      gantt.forEach(function (g) { if (g.p === i) comp = Math.max(comp, g.end); });
      return {
        name: p.name, arr: p.arr, burst: p.burst, comp: comp,
        turn: comp - p.arr, wTurn: (comp - p.arr) / p.burst
      };
    });
    var avgTurn = sum(res.map(function (r) { return r.turn; })) / n;
    var avgW = sum(res.map(function (r) { return r.wTurn; })) / n;
    return { gantt: gantt, rows: res, avgTurn: round(avgTurn, 2), avgW: round(avgW, 3) };
  }

  function ganttHTML(g) {
    var total = g.length ? g[g.length - 1].end : 0;
    var h = '<div class="gantt">';
    g.forEach(function (x) {
      var w = (x.end - x.start) / total * 100;
      h += '<div class="gseg" style="flex:' + (x.end - x.start) + '"><b>P' + (x.p + 1) + '</b>' +
        '<span>' + x.start + '–' + x.end + '</span></div>';
    });
    h += '</div><div class="gline"><span>0</span>';
    g.forEach(function (x) { h += '<span>' + x.end + '</span>'; });
    h += '</div>';
    return h;
  }

  function genSched(rng, diff) {
    var pool = diff === 'easy' ? ['FCFS', 'SJF'] : ['FCFS', 'SJF', 'SRTF', 'RR', 'HRRN'];
    var algo = pick(rng, pool);
    var quantum = ri(rng, 1, 3);
    var procs = [];
    var used = {};
    for (var i = 0; i < 4; i++) {
      var arr = ri(rng, 0, 6);
      var burst = ri(rng, 1, 9);
      procs.push({ name: 'P' + (i + 1), arr: arr, burst: burst });
    }
    var res = runSchedule(procs, algo, quantum);
    var names = { FCFS: '先来先服务（FCFS）', SJF: '非抢占式短作业优先（SJF）', SRTF: '抢占式短作业优先（SRTF）',
                  RR: '时间片轮转（RR，时间片 ' + quantum + '）', HRRN: '高响应比优先（HRRN）' };
    var prompt = '<p>系统中有 4 个进程，到达时刻与运行时间如下表（单处理机，忽略切换开销）：</p>' +
      '<table class="tbl"><thead><tr><th>进程</th><th>到达时刻</th><th>运行时间</th></tr></thead><tbody>' +
      procs.map(function (p) { return '<tr><td>' + p.name + '</td><td>' + p.arr + '</td><td>' + p.burst + '</td></tr>'; }).join('') +
      '</tbody></table><p>采用<b>' + names[algo] + '</b>，求调度顺序（甘特图）、各进程周转时间、平均周转时间和平均带权周转时间。</p>';

    var answer = '<h4>甘特图</h4>' + ganttHTML(res.gantt);
    answer += '<table class="tbl"><thead><tr><th>进程</th><th>到达</th><th>运行</th><th>完成</th><th>周转时间</th><th>带权周转</th></tr></thead><tbody>';
    res.rows.forEach(function (r) {
      answer += '<tr><td>' + r.name + '</td><td>' + r.arr + '</td><td>' + r.burst + '</td><td>' + r.comp +
        '</td><td>' + r.turn + '</td><td>' + r.wTurn.toFixed(2) + '</td></tr>';
    });
    answer += '</tbody></table><p class="mono">平均周转时间 = ' +
      res.rows.map(function (r) { return r.turn; }).join(' + ') + ' ÷ 4 = ' + res.avgTurn +
      '</p><p class="mono">平均带权周转时间 = ' +
      res.rows.map(function (r) { return r.wTurn.toFixed(2); }).join(' + ') + ' ÷ 4 = ' + res.avgW + '</p>';

    var needOrder = algo !== 'RR';
    var spec = [];
    if (needOrder) spec.push({ key: 'order', type: 'text', label: '调度顺序（如 P1,P2,P4,P1,P3）', placeholder: 'P1,P2,...' });
    spec.push({ key: 'avg', type: 'number', label: '平均周转时间' });
    spec.push({ key: 'avgw', type: 'number', label: '平均带权周转时间（保留 2～3 位小数）' });

    return {
      topic: 'sched', title: '进程调度 · ' + algo,
      promptHTML: prompt, answerHTML: answer, inputSpec: spec,
      truth: (function () {
        var t = { avg: res.avgTurn, avgw: res.avgW };
        if (needOrder) t.order = 'P' + res.gantt.map(function (g) { return g.p + 1; }).join(',P');
        return t;
      })(),
      check: function (v) {
        var parts = [];
        if (needOrder) {
          var userSeq = String(v.order || '').match(/\d+/g);
          var wantSeq = res.gantt.map(function (g) { return String(g.p + 1); });
          var okSeq = !!userSeq && userSeq.length === wantSeq.length && userSeq.every(function (x, i2) { return x === wantSeq[i2]; });
          parts.push({ name: '调度顺序', ok: okSeq, want: 'P' + wantSeq.join(',P') });
        }
        var okAvg = Math.abs(Number(v.avg) - res.avgTurn) < 0.01;
        parts.push({ name: '平均周转时间', ok: okAvg, want: res.avgTurn });
        var okW = Math.abs(Number(v.avgw) - res.avgW) < 0.02;
        parts.push({ name: '平均带权周转时间', ok: okW, want: res.avgW });
        return { ok: parts.every(function (p) { return p.ok; }), parts: parts };
      }
    };
  }

  /* ==========================================================================
     7. 首次适应
     ========================================================================== */
  function firstFitRun(memSize, ops) {
    var free = [{ start: 0, end: memSize }];
    var allocs = [];
    var timeline = [];
    ops.forEach(function (op) {
      if (op.type === 'alloc') {
        var at = -1;
        for (var i = 0; i < free.length; i++) {
          if (free[i].end - free[i].start >= op.size) { at = i; break; }
        }
        if (at < 0) { timeline.push({ op: op, ok: false }); return; }
        var blk = free[at];
        var start = blk.start;
        blk.start += op.size;
        if (blk.start === blk.end) free.splice(at, 1);
        allocs.push({ name: op.name, start: start, end: start + op.size, size: op.size });
        timeline.push({ op: op, ok: true, start: start });
      } else {
        var idx = -1;
        for (var j = 0; j < allocs.length; j++) if (allocs[j].name === op.name) { idx = j; break; }
        if (idx < 0) { timeline.push({ op: op, ok: false }); return; }
        var a = allocs.splice(idx, 1)[0];
        free.push({ start: a.start, end: a.end });
        free.sort(function (x, y) { return x.start - y.start; });
        var merged = [];
        free.forEach(function (f) {
          if (merged.length && merged[merged.length - 1].end === f.start) merged[merged.length - 1].end = f.end;
          else merged.push({ start: f.start, end: f.end });
        });
        free = merged;
        timeline.push({ op: op, ok: true });
      }
    });
    var used = sum(allocs.map(function (a) { return a.size; }));
    return { free: free, allocs: allocs, used: used, util: used / memSize * 100, timeline: timeline };
  }

  function genFirstFit(rng, diff) {
    var mem = diff === 'easy' ? 512 : pick(rng, [512, 1024]);
    var ops = [], live = [];
    var target = ri(rng, 5, 7);
    var jn = 1;
    for (var i = 0; i < target; i++) {
      var canFree = live.length >= 2;
      var doFree = canFree && rng() < 0.35;
      if (doFree) {
        var who = pick(rng, live);
        ops.push({ type: 'free', name: who });
        live = live.filter(function (x) { return x !== who; });
      } else {
        var size = ri(rng, 20, diff === 'easy' ? 100 : 150);
        var name = 'J' + jn++;
        ops.push({ type: 'alloc', name: name, size: size });
        live.push(name);
      }
    }
    var run = firstFitRun(mem, ops);
    if (run.used === 0) return genFirstFit(rng, diff);

    var prompt = '<p>系统内存用户区大小为 <b>' + mem + 'KB</b>，初始全部空闲，采用<b>首次适应（FF）</b>算法。' +
      '按下列顺序申请与释放内存：</p><ol class="ops">' +
      ops.map(function (o) {
        return '<li>' + (o.type === 'alloc' ? o.name + ' 申请 ' + o.size + 'KB' : o.name + ' 释放') + '</li>';
      }).join('') + '</ol>' +
      '<p>求全部操作完成后的空闲分区（用左闭右开区间表示），以及内存利用率（已分配空间 ÷ 总内存）。</p>';

    var answer = '<h4>分配过程</h4><table class="tbl"><thead><tr><th>操作</th><th>结果</th></tr></thead><tbody>';
    run.timeline.forEach(function (t) {
      answer += '<tr><td>' + (t.op.type === 'alloc' ? t.op.name + ' 申请 ' + t.op.size + 'KB' : t.op.name + ' 释放') +
        '</td><td>' + (t.ok ? (t.op.type === 'alloc' ? '放入 [' + t.start + ',' + (t.start + t.op.size) + ')' : '释放，合并相邻空闲区') : '失败') + '</td></tr>';
    });
    answer += '</tbody></table>';
    answer += '<p>最终已分配：' + (run.allocs.length ? run.allocs.map(function (a) {
      return a.name + ' [' + a.start + ',' + a.end + ')';
    }).join('，') : '无') + '</p>';
    answer += '<p>最终空闲分区：<b>' + run.free.map(function (f) { return '[' + f.start + ',' + f.end + ')'; }).join('、') +
      '</b></p>';
    answer += '<p class="mono">内存利用率 = ' + run.used + ' ÷ ' + mem + ' = ' + (run.util).toFixed(1) + '%</p>';

    return {
      topic: 'firstfit', title: '首次适应算法',
      promptHTML: prompt, answerHTML: answer,
      truth: { free: run.free.map(function (f) { return '[' + f.start + ',' + f.end + ')'; }).join(','),
               util: +run.util.toFixed(1) },
      inputSpec: [
        { key: 'free', type: 'text', label: '空闲分区（如 [70,160),[390,512)）' },
        { key: 'util', type: 'number', label: '内存利用率（%）' }
      ],
      check: function (v) {
        var got = parseIntervals(v.free);
        var want = run.free.map(function (f) { return [f.start, f.end]; });
        var okFree = got && got.length === want.length && got.every(function (g, i2) {
          return g[0] === want[i2][0] && g[1] === want[i2][1];
        });
        var okUtil = Math.abs(Number(v.util) - run.util) < 0.6;
        return {
          ok: !!okFree && okUtil,
          parts: [
            { name: '空闲分区', ok: !!okFree, want: want.map(function (f) { return '[' + f[0] + ',' + f[1] + ')'; }).join('、') },
            { name: '内存利用率', ok: okUtil, want: run.util.toFixed(1) + '%' }
          ]
        };
      }
    };
  }

  function parseIntervals(s) {
    if (!s) return null;
    var nums = String(s).match(/\d+(?:\.\d+)?/g);
    if (!nums || nums.length % 2) return null;
    var out = [];
    for (var i = 0; i < nums.length; i += 2) out.push([Number(nums[i]), Number(nums[i + 1])]);
    return out;
  }

        '，周转时间 = 完成 − 到达 = ' + turns.join('、') + '。</p>' +
        '<p class="mono">平均周转时间 = (' + turns.join(' + ') + ') ÷ ' + n5 + ' = <b>' + (+avg5.toFixed(2)) + '</b></p>'

    var html = '<ol class="quick">';
    items.forEach(function (it, i) {

<script>/* ==========================================================================

  function esc(s) {

      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;

  function now() { return Date.now(); }
  function humanTime(ts) {
    if (!ts) return '—';

    if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    return Math.floor(d / 86400) + ' 天前';
  }
  // 表格在窄屏上要能横向滚动，统一套一层容器
  function wrapTables(root) {
    $$('table.tbl', root).forEach(function (t) {
      var p = t.parentNode;
      if (p && p.classList && p.classList.contains('tblwrap')) return;
      var d = document.createElement('div');
      d.className = 'tblwrap';
      p.insertBefore(d, t);
      d.appendChild(t);
    });
  }
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  /* ---------------------------- 本地存储 ---------------------------- */
  var KEY = 'osq.progress.v1', TKEY = 'osq.theme.v1';
  var store = { stats: {}, wrong: {}, exam: null, examResult: null };

    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      store.stats = (o.stats && typeof o.stats === 'object') ? o.stats : {};
      store.wrong = (o.wrong && typeof o.wrong === 'object') ? o.wrong : {};

      store.examResult = o.examResult || null;
    } catch (e) { store = { stats: {}, wrong: {}, exam: null, examResult: null }; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 隐私模式等：忽略 */ }
  }
  function record(chapter, ok) {
    var s = store.stats[chapter] || (store.stats[chapter] = { n: 0, ok: 0, last: 0 });
    s.n++; if (ok) s.ok++;

    saveStore();
  }
  function wrongAdd(id, chapter) {
    var w = store.wrong[id] || (store.wrong[id] = { chapter: chapter, streak: 0, at: 0 });
    w.streak = 0; w.at = now();
    saveStore();
  }
  function wrongHit(id) {
    var w = store.wrong[id];
    if (!w) return false;
    w.streak = (w.streak || 0) + 1;

    saveStore();
    return false;
  }

  /* ---------------------------- 状态 ---------------------------- */

    var t = document.querySelector('.top');

  function toggleTheme() {

    document.documentElement.dataset.theme = next;

        '<span>' + p.name + '</span><span class="want">正确答案：' + esc(p.want) + '</span></li>';
    });
    html += '</ul>';
    fb.className = 'feedback show ' + (r.ok ? 'ok' : 'bad');
    fb.innerHTML = html;
    $('#calcSol').hidden = false;
    if (!view.calc.counted) {
      view.calc.counted = true;
      record(q.chapter, r.ok);
    }
  }

  /* ============================ ② 概念题 ============================ */
  function tokenize(s) {
    s = String(s || '');
    s = s.replace(/(\d)\s+(ms|毫秒|mb|kb|gb|b)\b/gi, '$1$2');
    s = s.replace(/请求(和|与|并)保持|占有(并|且)等待/g, 'REQHOLD');
    s = s.replace(/[和与]/g, '、');
    return s.split(/[、,，;；\/\s]+/).filter(Boolean).map(normToken);
  }
  function normToken(s) {
    var t = String(s).toLowerCase().replace(/\s+/g, '');
    t = t.replace(/[，。、；;：:,.!！?？"'“”‘’()（）\[\]【】<>《》\-—_\\\/]/g, '');
    var map = {
      '主存': '内存', '阻塞': '等待', '运行': '执行', '处理器': '处理机',
      '可抢占': '抢占', '不可抢占': '非抢占', '短作业': '短作业优先', '短进程': '短进程优先',
      'reqhold': '请求和保持', '占有并等待': '请求和保持', '占有且等待': '请求和保持'
    };
    if (map[t]) t = map[t];
    if (/^\d/.test(t)) t = t.replace(/(毫秒|ms|mb|kb|gb|b|个|台|块|次)$/, '');
    return t;
  }
  function fillMatch(input, accept) {
    var toks = tokenize(input);
    if (!toks.length) return false;
    for (var i = 0; i < accept.length; i++) {
      var acc = accept[i].map(normToken);
      if (acc.length === toks.length) {
        var same = true;
        for (var j = 0; j < acc.length; j++) if (acc[j] !== toks[j]) { same = false; break; }
        if (same) return true;
      }
      if (acc.length === 1 && toks.length === 1) {
        if (toks[0] === acc[0]) return true;
        if (!/^\d+$/.test(acc[0]) && toks[0].indexOf(acc[0]) >= 0) return true;
      }
      if (acc.length === 1 && acc[0] !== '' && toks.join('') === acc[0]) return true;
    }
    return false;
  }

  function findItem(id) {
    for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
    return null;
  }

  function conceptPool() {
    var c = view.concept;
    if (c.mode === 'one') return c.oneItem ? [c.oneItem] : [];
    if (c.mode === 'wrong') return ITEMS.filter(function (i) { return !!store.wrong[i.id]; });
    if (c.mode === 'random20') {
      if (!c.randomList) c.randomList = shuffle(ITEMS).slice(0, 20);
      return c.randomList.filter(function (i) { return i; });
    }
    if (c.chapter === '全部') return ITEMS.slice();
    return ITEMS.filter(function (i) { return i.chapter === c.chapter; });
  }

  function renderConceptControls() {
    var chapters = ['全部'].concat(CHAPTERS);
    var html = '';
    chapters.forEach(function (ch) {
      var n = ch === '全部' ? ITEMS.length : ITEMS.filter(function (i) { return i.chapter === ch; }).length;
      html += '<button class="chip' + (view.concept.mode === 'chapter' && view.concept.chapter === ch ? ' on' : '') +
        '" data-act="chapter" data-ch="' + ch + '">' + ch + '<span class="n">' + n + '</span></button>';
    });
    html += '<button class="chip' + (view.concept.mode === 'random20' ? ' on' : '') +
      '" data-act="random20">随机 20 题</button>';
    if (Object.keys(store.wrong).length) {
      html += '<button class="chip' + (view.concept.mode === 'wrong' ? ' on' : '') +
        '" data-act="practice-wrong">只练错题<span class="n">' + Object.keys(store.wrong).length + '</span></button>';
    }
    $('#conceptChips').innerHTML = html;

  function renderConcept() {
    renderConceptControls();
    var list = conceptPool();
    var box = $('#conceptList');
    if (!list.length) {
      box.innerHTML = '<div class="empty">这个范围里还没有题目。</div>';

    box.innerHTML = '<div class="toolbar"><span class="badge">' + title + ' · 共 ' + list.length + ' 题</span>' +
