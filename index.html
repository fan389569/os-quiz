  function cardHTML(item) {
    var st = view.concept.state[item.id];
    var answered = !!st;
    var h = '<article class="ccard" data-cid="' + item.id + '">' +
      '<div class="meta"><span>' + item.source + '</span><span class="badge chapter">' + item.chapter + '</span>' +
      '<span class="badge">' + ({ mcq: '单选', judge: '判断', fill: '填空', short: '简答' }[item.type]) + '</span></div>' +
      '<div class="stem">' + item.stem + '</div>';

    if (item.type === 'mcq') {
      h += '<div class="opts">' + item.options.map(function (o, i) {
        var k = 'ABCD'[i];
        var cls = 'opt';
        if (answered) {
          if (k === item.answer) cls += ' correct';
          else if (st.val === k) cls += ' wrong';
          else cls += ' dim';
          if (st.val === k) cls += ' chosen';
        }
        return '<button class="' + cls + '"' + (answered ? '' : ' data-act="pick"') + ' data-v="' + k + '"><span class="k">' + k +
          '</span><span>' + o + '</span></button>';
      }).join('') + '</div>';
    } else if (item.type === 'judge') {
      h += '<div class="judgebar">' + ['√', '×'].map(function (v) {
        var cls = 'opt';
        if (answered) {
          if (v === item.answer) cls += ' correct';
          else if (st.val === v) cls += ' wrong';
          else cls += ' dim';
          if (st.val === v) cls += ' chosen';
        }
        return '<button class="' + cls + '"' + (answered ? '' : ' data-act="pick"') + ' data-v="' + v + '">' +
          '<span class="k">' + v + '</span><span>' + (v === '√' ? '对' : '错') + '</span></button>';
      }).join('') + '</div>';
    } else if (item.type === 'fill' && !answered) {
      h += '<div class="fillrow"><input data-fill="' + item.id + '" type="text" placeholder="写出答案，多个空用顿号或逗号隔开">' +
        '<button class="btn" data-act="fill-submit">提交</button></div>';
    } else if (item.type === 'short' && !answered) {
      h += '<div class="actions"><button class="btn" data-act="short-reveal">查看参考答案</button></div>';
    }

    if (answered) h += revealHTML(item, st);
    return h + '</article>';
  }

  function revealHTML(item, st) {
    var neutral = (item.type === 'short' && st.ok === null);
    var cls = neutral ? '' : (st.ok ? 'ok' : 'bad');
    var h = '<div class="reveal ' + cls + '">';
    if (neutral) {
      h += '<div class="verdict" style="color:var(--muted)">参考答案，请自评</div>';
    } else {
      h += '<div class="verdict">' + (st.ok ? '✓ 答对了' : '✗ 答错了') + '</div>';
    }
    if (item.type === 'mcq' || item.type === 'judge') {
      h += '<div class="ans">答案：<b>' + item.answerText + '</b>' + (st.ok ? '' : '（你选的是 ' + st.val + '）') + '</div>';
    } else if (item.type === 'fill') {
      h += '<div class="ans">答案：<b>' + esc(item.answer) + '</b>' + (st.ok ? '' : '（你写的是 ' + esc(st.val || '空') + '）') + '</div>';
    }
    h += '<div class="why"><b>理由：</b>' + item.reason + '</div>';
    if (item.type === 'short') h += '<div class="full">' + (item.answerHTML || '') + '</div>';
    if (item.note) h += '<div class="why" style="color:var(--warn)">注：' + item.note + '</div>';
    if (item.type === 'short' && st.self === undefined) {
      h += '<div class="selfrow">你写对了吗？<button data-act="self" data-v="ok">我答对了</button>' +
        '<button data-act="self" data-v="bad">我答错了</button></div>';
    } else if (item.type === 'short') {
      h += '<div class="selfrow">已自评：' + (st.self === 'ok' ? '答对' : '答错') + '</div>';
    }
    if (!neutral) {
      var w = store.wrong[item.id];
      h += '<div class="selfrow"><button data-act="redo">再做一次</button>' +
        (w ? '<span>连对 ' + (w.streak || 0) + '/2 次后移出错题本</span>' : '') + '</div>';
    }
    return h + '</div>';
  }

  function refreshCard(id) {
    var el = document.querySelector('[data-cid="' + id + '"]');
    var item = findItem(id);
    if (!el || !item) return;
    if (view.concept.mode === 'wrong' && !store.wrong[id]) {
      el.parentNode.removeChild(el);
      toast('连续答对 2 次，已移出错题本');
      renderConceptControls();
      if (!conceptPool().length) renderConcept();
    } else {
      el.outerHTML = cardHTML(item);
      var fresh = document.querySelector('[data-cid="' + id + '"]');
      if (fresh) wrapTables(fresh);
    }
  }

  function submitFill(id, inputEl) {
    var item = findItem(id);
    if (!item) return;
    var val = inputEl ? inputEl.value : '';
    if (!String(val).trim()) { toast('先写答案再提交'); return; }
    var ok = fillMatch(val, item.accept);
    view.concept.state[id] = { ok: ok, val: val };
    if (ok) wrongHit(id); else wrongAdd(id, item.chapter);
    record(item.chapter, ok);
    refreshCard(id);
  }

  /* ============================ ③ 模拟整卷 ============================ */
  var EXAM_MIN = 120;
  var examTimer = null;

  function buildExam() {
    var mcq = shuffle(ITEMS.filter(function (i) { return i.type === 'mcq'; })).slice(0, 15);
    var judge = shuffle(ITEMS.filter(function (i) { return i.type === 'judge'; })).slice(0, 10);
    var fill = shuffle(ITEMS.filter(function (i) { return i.type === 'fill'; })).slice(0, 5);
    var extra = ['inode', 'addr', 'sched', 'firstfit'][Math.floor(Math.random() * 4)];
    var comps = [
      { topic: 'banker', pts: 12, seed: Math.floor(Math.random() * 2e9) },
      { topic: 'paging', pts: 12, seed: Math.floor(Math.random() * 2e9) },
      { topic: 'disk', pts: 6, seed: Math.floor(Math.random() * 2e9) },
      { topic: extra, pts: 10, seed: Math.floor(Math.random() * 2e9) }
    ];
    return {
      mcq: mcq.map(function (i) { return i.id; }),
      judge: judge.map(function (i) { return i.id; }),
      fill: fill.map(function (i) { return i.id; }),
      comps: comps,
      answers: {},
      deadline: now() + EXAM_MIN * 60000,
      submitted: false,
      startedAt: now()
    };
  }

  function examQuestions(exam) {
    var byId = {};
    ITEMS.forEach(function (i) { byId[i.id] = i; });
    return {
      mcq: exam.mcq.map(function (id) { return byId[id]; }),
      judge: exam.judge.map(function (id) { return byId[id]; }),
      fill: exam.fill.map(function (id) { return byId[id]; }),
      comps: exam.comps.map(function (c) { return OSQ.gen(c.topic, c.seed, 'std'); })
    };
  }

  function renderExamEntry() {
    var box = $('#examBox');
    if (view.exam && !view.exam.submitted) { renderExamPaper(); return; }
    var resume = store.exam && store.exam.deadline > now() && !store.exam.submitted;
    var last = store.examResult;
    var html = '<article class="card"><div class="qhead"><h2>模拟整卷</h2>' +
      '<span class="badge chapter">100 分 · 120 分钟</span></div>' +
      '<p>按学校试卷结构随机组卷：</p>' +
      '<ul class="ops"><li><b>一、单项选择题</b> 15 题 × 2 分 = 30 分</li>' +
      '<li><b>二、判断题</b> 10 题 × 1 分 = 10 分</li>' +
      '<li><b>三、填空简答</b> 5 题 × 4 分 = 20 分</li>' +
      '<li><b>四、综合题</b> 40 分：银行家 12 + 页面置换 12 + 磁盘调度 6 + 其余 10</li></ul>' +
      '<p class="score-sub">选择题、判断题、填空题自动判分；综合题按小问给分。交卷后按考点统计得分率。</p>' +
      '<div class="actions">' +
      '<button class="btn primary" data-act="exam-start">开始考试</button>' +
      (resume ? '<button class="btn" data-act="exam-resume">继续上次未完成的考试</button>' : '') +
      '</div>';
    if (last) {
      html += '<div class="reveal" style="margin-top:16px"><div class="verdict">上次成绩：' +
        last.score + ' / 100（' + last.time + '）</div></div>';
    }
    html += '</article>';
    box.innerHTML = html;
  }

  function startExam(resume) {
    if (resume && store.exam) view.exam = store.exam;
    else { view.exam = buildExam(); store.exam = view.exam; saveStore(); }
    renderExamPaper();
    startTimer();
  }

  function startTimer() {
    if (examTimer) clearInterval(examTimer);
    examTimer = setInterval(function () {
      if (!view.exam || view.exam.submitted) { clearInterval(examTimer); return; }
      var left = Math.max(0, view.exam.deadline - now());
      var el = $('#examTimer');
      if (el) {
        el.textContent = fmtDur(left);
        el.classList.toggle('low', left < 5 * 60000);
      }
      if (left <= 0) { clearInterval(examTimer); submitExam(true); }
    }, 500);
    updateTimerOnce();
  }
  function updateTimerOnce() {
    var el = $('#examTimer');
    if (el && view.exam) {
      var left = Math.max(0, view.exam.deadline - now());
      el.textContent = fmtDur(left);
    }
  }
  function fmtDur(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function renderExamPaper() {
    var ex = view.exam, Q = examQuestions(ex);
    var h = '<div class="exambar"><span class="score-sub">已答 <b id="ansCount">' + countAnswered(ex) + '</b> / 30</span>' +
      '<button class="btn primary" data-act="exam-submit">交卷</button>' +
      '<span class="timer" id="examTimer">' + fmtDur(ex.deadline - now()) + '</span></div>';

    h += '<div class="examsec"><h2>一、单项选择题</h2><div class="desc">15 题，每题 2 分，共 30 分</div>';
    Q.mcq.forEach(function (it, i) {
      var key = 'm' + i, val = ex.answers[key];
      h += '<div class="eq" data-qkey="' + key + '"><div class="stem"><span class="num">' + (i + 1) + '.</span>' + it.stem + '</div>' +
        '<div class="opts">' + it.options.map(function (o, k) {
          var L = 'ABCD'[k];
          return '<button class="opt' + (val === L ? ' chosen' : '') + '" data-act="exam-pick" data-key="' + key +
            '" data-v="' + L + '"><span class="k">' + L + '</span><span>' + o + '</span></button>';
        }).join('') + '</div></div>';
    });
    h += '</div>';

    h += '<div class="examsec"><h2>二、判断题</h2><div class="desc">10 题，每题 1 分，共 10 分（对打 √，错打 ×）</div>';
    Q.judge.forEach(function (it, i) {
      var key = 'j' + i, val = ex.answers[key];
      h += '<div class="eq" data-qkey="' + key + '"><div class="stem"><span class="num">' + (i + 1) + '.</span>' + it.stem + '</div>' +
        '<div class="judgebar">' +
        '<button class="opt' + (val === '√' ? ' chosen' : '') + '" data-act="exam-pick" data-key="' + key + '" data-v="√"><span class="k">√</span><span>对</span></button>' +
        '<button class="opt' + (val === '×' ? ' chosen' : '') + '" data-act="exam-pick" data-key="' + key + '" data-v="×"><span class="k">×</span><span>错</span></button>' +
        '</div></div>';
    });
    h += '</div>';

    h += '<div class="examsec"><h2>三、填空简答</h2><div class="desc">5 题，每题 4 分，共 20 分</div>';
    Q.fill.forEach(function (it, i) {
      var key = 'f' + i;
      h += '<div class="eq" data-qkey="' + key + '"><div class="stem"><span class="num">' + (i + 1) + '.</span>' + it.stem + '</div>' +
        '<div class="fillrow"><input data-ekey="' + key + '" type="text" value="' + esc(ex.answers[key] || '') +
        '" placeholder="写出答案"></div></div>';
    });
    h += '</div>';

    h += '<div class="examsec"><h2>四、综合题</h2><div class="desc">' +
      ex.comps.map(function (c) { return c.pts + ' 分'; }).join(' + ') + '，共 40 分</div>';
    Q.comps.forEach(function (q, i) {
      var key = 'c' + i;
      var ans = ex.answers[key] || {};
      h += '<div class="eq" data-qkey="' + key + '"><div class="qhead" style="margin:0 0 8px;padding:0;border:0">' +
        '<b>综合题 ' + (i + 1) + '（' + ex.comps[i].pts + ' 分）</b><span class="badge chapter">' + q.chapter + '</span></div>' +
        '<div class="prompt">' + q.promptHTML + '</div><div class="answers">' +
        q.inputSpec.map(function (s) {
          var v = ans[s.key] === undefined ? '' : ans[s.key];
          var ekey = key + '.' + s.key;
          if (s.type === 'select') {
            return '<label class="field"><span>' + s.label + '</span><select data-ekey="' + ekey + '">' +
              '<option value="">请选择</option>' + s.options.map(function (o) {
                return '<option value="' + esc(o[0]) + '"' + (v === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
              }).join('') + '</select></label>';
          }
          return '<label class="field"><span>' + s.label + '</span><input data-ekey="' + ekey + '" type="' +
            (s.type === 'number' ? 'number' : 'text') + '" inputmode="' + (s.type === 'number' ? 'decimal' : 'text') +
            '" step="any" value="' + esc(v) + '"></label>';
        }).join('') + '</div></div>';
    });
    h += '</div>';
    $('#examBox').innerHTML = h;
    wrapTables($('#examBox'));
    startTimer();
  }

  function countAnswered(ex) { return Object.keys(ex.answers).filter(function (k) {
    var v = ex.answers[k];
    return v !== '' && v !== undefined && v !== null;
  }).length; }

  function submitExam(auto) {
    var ex = view.exam;
    if (!ex || ex.submitted) return;
    if (!auto && !confirm('确定交卷吗？未作答的题目按 0 分计。')) return;
    var Q = examQuestions(ex);
    var byChapter = {}, total = 0, detail = [];

    function addScore(ch, got, full) {
      var c = byChapter[ch] || (byChapter[ch] = { got: 0, full: 0 });
      c.got += got; c.full += full;
      total += got;
    }

    Q.mcq.forEach(function (it, i) {
      var v = ex.answers['m' + i], ok = v === it.answer;
      addScore(it.chapter, ok ? 2 : 0, 2);
      record(it.chapter, ok);
      if (!ok) detail.push({ src: it.source, stem: it.stem, want: it.answerText, got: v || '未答' });
    });
    Q.judge.forEach(function (it, i) {
      var v = ex.answers['j' + i], ok = v === it.answer;
      addScore(it.chapter, ok ? 1 : 0, 1);
      record(it.chapter, ok);
      if (!ok) detail.push({ src: it.source, stem: it.stem, want: it.answer, got: v || '未答' });
    });
    Q.fill.forEach(function (it, i) {
      var v = ex.answers['f' + i] || '', ok = fillMatch(v, it.accept);
      addScore(it.chapter, ok ? 4 : 0, 4);
      record(it.chapter, ok);
      if (!ok) detail.push({ src: it.source, stem: it.stem, want: it.answer, got: v || '未答' });
    });
    Q.comps.forEach(function (q, i) {
      var c = ex.comps[i], ans = ex.answers['c' + i] || {};
      var r = q.check(ans);
      var right = r.parts.filter(function (p) { return p.ok; }).length;
      var got = Math.round(c.pts * right / r.parts.length * 2) / 2;
      addScore(q.chapter, got, c.pts);
      record(q.chapter, right === r.parts.length);
      if (right < r.parts.length) {
        detail.push({ src: '模拟卷 · 综合题 ' + (i + 1), stem: q.title,
                      want: r.parts.filter(function (p) { return !p.ok; }).map(function (p) { return p.name + '：' + p.want; }).join('；'),
                      got: '有错误' });
      }
    });

    ex.submitted = true;
    ex.score = Math.round(total * 10) / 10;
    store.examResult = { score: ex.score, time: new Date().toLocaleString('zh-CN'), byChapter: byChapter };
    store.exam = null;
    saveStore();
    if (examTimer) clearInterval(examTimer);
    renderExamResult(ex, byChapter, detail);
  }

  function renderExamResult(ex, byChapter, detail) {
    var chapters = Object.keys(byChapter).map(function (ch) {
      var c = byChapter[ch];
      return { ch: ch, got: c.got, full: c.full, pct: c.full ? c.got / c.full : 0 };
    }).sort(function (a, b) { return a.pct - b.pct; });
    var weak = chapters.filter(function (c) { return c.full > 0; }).slice(0, 2);

    var h = '<article class="card"><div class="qhead"><h2>成绩单</h2><span class="badge chapter">模拟卷</span></div>' +
      '<div class="score-big">' + ex.score + ' <span class="score-sub">/ 100</span></div>' +
      '<p class="score-sub">' + (ex.score >= 60 ? '及格了，继续巩固最弱的考点。' : '还没到 60 分，先把下面的最弱考点过一遍。') + '</p>' +
      '<h3 style="margin-top:18px">按考点得分率</h3><div class="tblwrap"><table class="tbl"><thead><tr>' +
      '<th>考点</th><th>得分</th><th>满分</th><th>得分率</th></tr></thead><tbody>';
    chapters.forEach(function (c) {
      h += '<tr><td style="text-align:left">' + c.ch + '</td><td>' + c.got + '</td><td>' + c.full + '</td><td>' +
        Math.round(c.pct * 100) + '%</td></tr>';
    });
    h += '</tbody></table></div>';
    if (weak.length) {
      h += '<p class="warn" style="margin-top:12px">最需要补的两个考点：<b>' +
        weak.map(function (c) { return c.ch + '（' + Math.round(c.pct * 100) + '%）'; }).join('、') + '</b></p>';
      h += '<div class="actions">' + weak.map(function (c) {
        return '<button class="btn" data-act="go-chapter" data-ch="' + c.ch + '">去练「' + c.ch + '」</button>';
      }).join('') + '</div>';
    }
    if (detail.length) {
      h += '<h3 style="margin-top:20px">错题回顾（' + detail.length + '）</h3><div class="clist">';
      detail.forEach(function (d) {
        h += '<div class="ccard"><div class="meta"><span>' + d.src + '</span></div>' +
          '<div class="stem">' + d.stem + '</div>' +
          '<div class="reveal bad" style="margin-top:8px"><div class="ans">正确答案：<b>' + esc(d.want) +
          '</b></div><div class="why">你的答案：' + esc(d.got) + '</div></div></div>';
      });
      h += '</div>';
    }
    h += '<div class="actions" style="margin-top:18px"><button class="btn primary" data-act="exam-again">再来一套</button>' +
      '<button class="btn" data-act="tab" data-tab="stats">看统计</button></div></article>';
    $('#examBox').innerHTML = h;
    wrapTables($('#examBox'));
    window.scrollTo(0, 0);
  }

  /* ============================ ④ 错题本 ============================ */
  function renderWrong() {
    var ids = Object.keys(store.wrong);
    var box = $('#wrongBox');
    if (!ids.length) {
      box.innerHTML = '<div class="empty">错题本是空的。<br>做概念题或模拟卷时答错的题会自动收进来，连续答对 2 次后移出。</div>';
      return;
    }
    var groups = {};
    ids.forEach(function (id) {
      var w = store.wrong[id];
      (groups[w.chapter] = groups[w.chapter] || []).push(id);
    });
    var h = '<div class="toolbar"><button class="btn primary" data-act="practice-wrong">只练错题（' + ids.length + '）</button>' +
      '<span class="badge">连续答对 2 次自动移出</span></div>';
    Object.keys(groups).forEach(function (ch) {
      h += '<h3 style="margin:18px 0 8px;font-size:15px">' + ch + ' <span class="score-sub">' + groups[ch].length + ' 题</span></h3>';
      h += '<div class="clist">';
      groups[ch].forEach(function (id) {
        var it = findItem(id), w = store.wrong[id];
        if (!it) return;
        h += '<div class="ccard"><div class="meta"><span>' + it.source + '</span><span class="badge chapter">' +
          it.chapter + '</span><span class="badge">连对 ' + (w.streak || 0) + '/2</span></div>' +
          '<div class="stem">' + it.stem + '</div>' +
          '<div class="actions"><button class="btn small" data-act="practice-one" data-id="' + id + '">练这题</button></div></div>';
      });
      h += '</div>';
    });
    box.innerHTML = h;
  }

  /* ============================ ⑤ 统计 ============================ */
  function renderStats() {
    var chapters = CHAPTERS.slice();
    Object.keys(store.stats).forEach(function (c) { if (chapters.indexOf(c) < 0) chapters.push(c); });
    var totalN = 0, totalOk = 0;
    chapters.forEach(function (ch) {
      var s = store.stats[ch];
      if (s) { totalN += s.n; totalOk += s.ok; }
    });
    var h = '<div class="statgrid">' +
      '<div class="stat"><div class="k">累计做题</div><div class="v">' + totalN + '</div></div>' +
      '<div class="stat"><div class="k">总正确率</div><div class="v">' + (totalN ? Math.round(totalOk / totalN * 100) + '%' : '—') + '</div></div>' +
      '<div class="stat"><div class="k">错题本</div><div class="v">' + Object.keys(store.wrong).length + '</div></div>' +
      '<div class="stat"><div class="k">最近一次模拟</div><div class="v">' + (store.examResult ? store.examResult.score : '—') +
      (store.examResult ? '<span class="score-sub"> / 100</span>' : '') + '</div></div></div>';

    h += '<div class="card"><div class="qhead"><h2>各考点练习情况</h2></div><div class="tblwrap"><table class="tbl stats-table"><thead><tr>' +
      '<th>考点</th><th>做题数</th><th style="width:42%">正确率</th><th>最近练习</th></tr></thead><tbody>';
    var any = false;
    chapters.forEach(function (ch) {
      var s = store.stats[ch];
      if (!s || !s.n) return;
      any = true;
      var pct = Math.round(s.ok / s.n * 100);
      h += '<tr><td>' + ch + '</td><td>' + s.n + '</td>' +
        '<td><div class="rate"><span>' + pct + '%</span><div class="bar"><i class="' + (pct < 60 ? 'low' : '') +
        '" style="width:' + pct + '%"></i></div></div></td>' +
        '<td>' + humanTime(s.last) + '</td></tr>';
    });
    if (!any) h += '<tr><td colspan="4" style="text-align:center;color:var(--muted)">还没有练习记录</td></tr>';
    h += '</tbody></table></div></div>';

    h += '<div class="card"><div class="qhead"><h2>进度导出 / 导入</h2></div>' +
      '<p class="score-sub">换设备或清缓存前，把下面这段 JSON 复制保存；粘贴回来点「导入」即可恢复。</p>' +
      '<textarea class="export-area" id="exportArea">' + esc(JSON.stringify({ stats: store.stats, wrong: store.wrong }, null, 1)) + '</textarea>' +
      '<div class="actions"><button class="btn" data-act="copy">复制</button>' +
      '<button class="btn" data-act="import">导入上面的内容</button></div></div>';

    h += '<div class="card"><div class="qhead"><h2>计算引擎自测</h2></div>' +
      '<p class="score-sub">固定样例取自真题原卷（含老师更正过的答案），用于确认每道计算题的答案都由同一套计算得出。</p>' +
      '<div class="actions"><button class="btn" data-act="selftest">运行自测</button></div>' +
      '<div id="selftestOut" style="margin-top:10px"></div></div>';

    $('#statsBox').innerHTML = h;
  }

  function runSelftest() {
    var r = OSQ.runSelfTests();
    var h = '<div class="selftest">' + r.lines.map(function (l) {
      return '<div class="' + (l.indexOf('PASS') === 0 ? 'ok' : 'no') + '">' + esc(l) + '</div>';
    }).join('') + '<div style="margin-top:6px"><b>' + r.pass + ' 项通过，' + r.fail + ' 项失败</b></div></div>';
    $('#selftestOut').innerHTML = h;
  }

  /* ============================ 事件 ============================ */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;

    if (act === 'tab') { switchTab(el.dataset.tab); return; }

    /* 计算 */
    if (act === 'calc-submit') { submitCalc(); return; }
    if (act === 'calc-new') { newCalc(); return; }
    if (act === 'calc-sol') { $('#calcSol').hidden = false; return; }
    if (act === 'topic') { newCalc(el.dataset.topic); return; }
    if (act === 'diff') { newCalc(null, el.dataset.diff); return; }

    /* 概念 */
    if (act === 'chapter') {
      view.concept.mode = 'chapter';
      view.concept.chapter = el.dataset.ch;
      view.concept.randomList = null;
      renderConcept();
      return;
    }
    if (act === 'random20') { view.concept.mode = 'random20'; view.concept.randomList = shuffle(ITEMS).slice(0, 20); renderConcept(); return; }
    if (act === 'practice-wrong') {
      view.concept.mode = 'wrong';
      Object.keys(store.wrong).forEach(function (id) { delete view.concept.state[id]; });
      switchTab('concept');
      renderConcept();
      return;
    }
    if (act === 'practice-one') {
      view.concept.mode = 'wrong';
      view.concept.onlyId = el.dataset.id;
      switchTab('concept');
      var only = [findItem(el.dataset.id)];
      view.concept.mode = 'one';
      view.concept.oneItem = only[0];
      delete view.concept.state[only[0].id];
      renderConcept();
      return;
    }
    if (act === 'pick') {
      var card = el.closest('[data-cid]');
      var item = findItem(card.dataset.cid);
      var val = el.dataset.v;
      var ok = val === item.answer;
      view.concept.state[item.id] = { ok: ok, val: val };
      if (ok) wrongHit(item.id); else wrongAdd(item.id, item.chapter);
      record(item.chapter, ok);
      refreshCard(item.id);
      return;
    }
    if (act === 'fill-submit') {
      var fc = el.closest('[data-cid]');
      var inp = $('[data-fill]', fc);
      submitFill(fc.dataset.cid, inp);
      return;
    }
    if (act === 'short-reveal') {
      var sc = el.closest('[data-cid]');
      var si = findItem(sc.dataset.cid);
      view.concept.state[si.id] = { ok: null, self: undefined, val: '' };
      sc.outerHTML = cardHTML(si);
      return;
    }
    if (act === 'self') {
      var sc2 = el.closest('[data-cid]');
      var si2 = findItem(sc2.dataset.cid);
      var selfOk = el.dataset.v === 'ok';
      view.concept.state[si2.id] = { ok: selfOk, self: selfOk ? 'ok' : 'bad', val: '自评' };
      if (selfOk) wrongHit(si2.id); else wrongAdd(si2.id, si2.chapter);
      record(si2.chapter, selfOk);
      sc2.outerHTML = cardHTML(si2);
      return;
    }
    if (act === 'redo') {
      var rc = el.closest('[data-cid]');
      delete view.concept.state[rc.dataset.cid];
      refreshCard(rc.dataset.cid);
      return;
    }

    /* 模拟卷 */
    if (act === 'exam-start') { startExam(false); return; }
    if (act === 'exam-resume') { startExam(true); return; }
    if (act === 'exam-again') { view.exam = null; startExam(false); return; }
    if (act === 'exam-submit') { submitExam(false); return; }
    if (act === 'exam-pick') {
      var key = el.dataset.key;
      view.exam.answers[key] = el.dataset.v;
      saveStore();
      $$('[data-key="' + key + '"]', $('#examBox')).forEach(function (b) {
        b.classList.toggle('chosen', b.dataset.v === el.dataset.v);
      });
      var c = $('#ansCount');
      if (c) c.textContent = countAnswered(view.exam);
      return;
    }
    if (act === 'go-chapter') {
      view.concept.mode = 'chapter';
      view.concept.chapter = el.dataset.ch;
      view.concept.randomList = null;
      switchTab('concept');
      return;
    }

    /* 统计 */
    if (act === 'copy') {
      var ta = $('#exportArea');
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (err) { done = false; }
      if (!done && navigator.clipboard) {
        navigator.clipboard.writeText(ta.value).then(function () { toast('已复制'); }, function () { toast('复制失败，请手动全选复制'); });
      } else {
        toast(done ? '已复制' : '请手动全选复制');
      }
      return;
    }
    if (act === 'import') {
      var raw = $('#exportArea').value;
      try {
        var o = JSON.parse(raw);
        if (!o || typeof o !== 'object' || !o.stats) throw new Error('bad');
        store.stats = o.stats || {};
        store.wrong = o.wrong || {};
        saveStore();
        renderStats();
        toast('已导入');
      } catch (err) {
        toast('内容不是有效的进度 JSON');
      }
      return;
    }
    if (act === 'selftest') { runSelftest(); return; }
  });

  // 考试中的输入（填空与综合题）
  function onExamInput(e) {
    var el = e.target.closest('[data-ekey]');
    if (!el || !view.exam || view.exam.submitted) return;
    var key = el.dataset.ekey;
    if (key.indexOf('.') > 0) {
      var parts = key.split('.');
      var obj = view.exam.answers[parts[0]] || (view.exam.answers[parts[0]] = {});
      obj[parts[1]] = el.value;
    } else {
      view.exam.answers[key] = el.value;
    }
    var c = $('#ansCount');
    if (c) c.textContent = countAnswered(view.exam);
    saveStore();
  }
  document.addEventListener('input', onExamInput);
  document.addEventListener('change', onExamInput);

  // 概念题填空按回车提交
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var el = e.target.closest('[data-fill]');
    if (el) { e.preventDefault(); submitFill(el.dataset.fill, el); }
  });

  /* ---------------------------- 初始化 ---------------------------- */
  var inited = false;
  function init() {
    if (inited) return;
    inited = true;
    loadStore();
    syncTop();
    window.__osq = view;       // 便于调试/自动化测试，不影响使用
    window.__osqStore = store;
    // 顶部主题按钮
    $('#themeBtn').addEventListener('click', toggleTheme);
    // 计算题标签
    $('#topicChips').innerHTML = OSQ.TOPICS.map(function (t) {
      return '<button class="chip' + (t.id === 'banker' ? ' on' : '') + '" data-act="topic" data-topic="' +
        t.id + '">' + t.name + '</button>';
    }).join('');
    newCalc();
    switchTab('calc');
  }

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();
})();
</script>
</body>
</html>
